name: Desktop preview

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, cross-platform-preview]

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            build: npm run pack -- --win --x64 --publish never
            smoke: npm run smoke:desktop -- --packaged
            artifact: dist/win-unpacked/
          - target: macos-arm64
            runner: macos-15
            build: npm run pack:mac -- --arm64 --config.mac.identity=- --config.mac.hardenedRuntime=false
            smoke: npm run smoke:desktop -- --packaged
            artifact: dist/*.dmg
          - target: linux-x64
            runner: ubuntu-24.04
            build: npm run pack:linux -- --x64
            smoke: JINGBAN_SMOKE_EXECUTABLE=/usr/bin/jingban xvfb-run -a npm run smoke:desktop -- --packaged
            artifact: dist/*.deb
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop and packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libopenjp2-tools
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm test
      - run: ${{ matrix.build }}
      - name: Install the Linux preview package
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ./dist/*.deb
      - run: ${{ matrix.smoke }}
      - uses: actions/upload-artifact@v4
        with:
          name: jingban-preview-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
